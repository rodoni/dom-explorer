[project]
name = "dom-explorer"
version = "0.1.0"
description = "MCP Server para exploração do DOM e automação de testes com Robot Framework"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.3.0",
    "playwright>=1.49.0",
    "pydantic>=2.0.0",
]

[project.scripts]
dom-explorer = "dom_explorer.server:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
